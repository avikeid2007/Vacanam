name: Build & Release Vacanam Installer

on:
  push:
    tags:
      - 'v*.*.*'          # Triggers on version tags like v1.0.0, v1.2.3
  workflow_dispatch:       # Allow manual trigger from GitHub Actions UI
    inputs:
      version:
        description: 'Version to build (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

env:
  DOTNET_VERSION: '10.0.x'
  PROJECT_PATH: src/Vacanam.App/Vacanam.App.csproj
  SOLUTION_PATH: Vacanam.slnx
  PUBLISH_DIR: publish
  INSTALLER_DIR: installer

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  build-and-package:
    name: Build · Publish · Package Installer
    runs-on: windows-latest

    # Grant GITHUB_TOKEN permission to create GitHub Releases
    permissions:
      contents: write   # Required: create releases & upload release assets
      actions: read     # Required: read workflow artifacts

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Resolve version ───────────────────────────────────────────────
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "push") {
            $ver = "${{ github.ref_name }}" -replace '^v', ''
          } else {
            $ver = "${{ github.event.inputs.version }}"
          }
          echo "VERSION=$ver" >> $env:GITHUB_ENV
          echo "version=$ver" >> $env:GITHUB_OUTPUT
          Write-Host "Building version: $ver"

      # ── 3. Setup .NET 10 ─────────────────────────────────────────────────
      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # ── 4. Restore NuGet packages ────────────────────────────────────────
      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      # ── 5. Build solution (verify no errors) ─────────────────────────────
      - name: Build solution
        run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore

      # ── 6. Publish self-contained application for installer ─────────────
      - name: Publish Vacanam (self-contained, win-x64)
        run: |
          dotnet publish ${{ env.PROJECT_PATH }} `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output ${{ env.PUBLISH_DIR }} `
            /p:AssemblyVersion=${{ env.VERSION }} `
            /p:FileVersion=${{ env.VERSION }} `
            /p:InformationalVersion=${{ env.VERSION }}

      # ── 6b. Sign binary with Code Signing Certificate (Avnish Kumar) ──────
      - name: Sign Vacanam.exe
        if: ${{ secrets.CODESIGN_PFX != '' }}
        shell: pwsh
        run: |
          $pfxBytes = [System.Convert]::FromBase64String("${{ secrets.CODESIGN_PFX }}")
          [System.IO.File]::WriteAllBytes("installer\cert.pfx", $pfxBytes)
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -First 1 -ExpandProperty FullName
          & $signtool sign /f "installer\cert.pfx" /p "${{ secrets.CODESIGN_PASSWORD }}" /tr http://timestamp.digicert.com /td sha256 /fd sha256 "${{ env.PUBLISH_DIR }}\Vacanam.exe"
          Write-Host "Vacanam.exe digitally signed."

      # ── 7. Compile Inno Setup installer ──────────────────────────────────
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer with Inno Setup
        env:
          APP_VERSION: ${{ env.VERSION }}
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "installer\Vacanam.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          Write-Host "Installer built successfully."

      # ── 8. Sign Installer Package ─────────────────────────────────────────
      - name: Sign VacanamSetup.exe
        if: ${{ secrets.CODESIGN_PFX != '' }}
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -First 1 -ExpandProperty FullName
          & $signtool sign /f "installer\cert.pfx" /p "${{ secrets.CODESIGN_PASSWORD }}" /tr http://timestamp.digicert.com /td sha256 /fd sha256 "installer\VacanamSetup-${{ env.VERSION }}.exe"
          Remove-Item "installer\cert.pfx" -Force -ErrorAction SilentlyContinue
          Write-Host "VacanamSetup-${{ env.VERSION }}.exe digitally signed."

      # ── 9. List installer output ─────────────────────────────────────────
      - name: List installer artifacts
        shell: pwsh
        run: |
          Get-ChildItem installer/ -Filter "*.exe" | ForEach-Object {
            Write-Host "$($_.Name)  ($([math]::Round($_.Length / 1MB, 1)) MB)"
          }

      # ── 10. Upload installer as workflow artifact ─────────────────────────
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: VacanamSetup-${{ env.VERSION }}
          path: installer/VacanamSetup-${{ env.VERSION }}.exe
          retention-days: 30

      # ── 11. Create GitHub Release (only on tag push) ──────────────────────
      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "Vacanam v${{ env.VERSION }}"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          body: |
            ## 🎙️ Vacanam v${{ env.VERSION }}

            **Local-first voice typing & AI text refinement for Windows 10/11 x64.**

            ### 📦 Installation
            1. Download `VacanamSetup-${{ env.VERSION }}.exe` below
            2. Run the installer (no admin rights required)
            3. Vacanam will launch in the System Tray — hold `Ctrl+Space` anywhere to dictate

            > ℹ️ **Windows SmartScreen Note**: If Windows shows a *"Windows protected your PC"* blue popup, click **More info** ➔ **Run anyway**. (Code signing via SignPath is currently in progress).

            ### ⚡ Requirements
            - Windows 10 1809+ / Windows 11 (x64)
            - ~150 MB disk space (Ultra Fast speech model auto-downloads on first run: ~75 MB)
            - No internet required after initial setup

            > 🔒 **100% Local & Offline** — No cloud APIs, no telemetry.
          files: |
            installer/VacanamSetup-${{ env.VERSION }}.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
